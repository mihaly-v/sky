<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>満点の星空と流れ星 - Starlight Dynamic Canopy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* キャンバスレイヤー */
    #space {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 幻想的な背景グラデーション（星雲風） */
    .nebula {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(20, 30, 80, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(60, 20, 80, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(10, 15, 30, 0.6) 0%, transparent 80%);
      z-index: 0;
      pointer-events: none;
    }

    /* 地上のシルエット */
    .horizon {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20vh;
      background: linear-gradient(to top, rgba(2, 2, 8, 1) 0%, rgba(2, 2, 8, 0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* 操作ガイドテキスト */
    .ui-overlay {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      letter-spacing: 2px;
      z-index: 3;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    /* オーディオコントロールエリア */
    .audio-container {
      position: absolute;
      top: 25px;
      right: 25px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
    }

    .audio-control {
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }

    /* 音量スライダーのスタイリング */
    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <div class="nebula"></div>
  <canvas id="space"></canvas>
  <div class="horizon"></div>
  <div class="ui-overlay">Click the screen</div>

  <!-- Sound Controls -->
  <div class="audio-container" id="audioContainer">
    <button id="audioBtn" class="audio-control">
      <span id="audioIcon">🎵</span> <span id="audioText">BGM</span>
    </button>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
  </div>

  <!-- ローカルの bgm.mp3 を指定 -->
  <audio id="bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');

    let width, height;
    let stars = [];
    let shootingStars = [];

    // 地球の自転パラメータ
    let rotationCenter = { x: 0, y: 0 };
    const rotationSpeed = 0.00015;

    // --- BGM・音量関連の制御 ---
    const bgm = document.getElementById('bgm');
    const audioBtn = document.getElementById('audioBtn');
    const audioIcon = document.getElementById('audioIcon');
    const audioText = document.getElementById('audioText');
    const volumeSlider = document.getElementById('volumeSlider');
    const audioContainer = document.getElementById('audioContainer');

    let isAudioPlaying = false;

    bgm.volume = 0.3; // 初期音量

    // BGMボタンを押した時だけ再生・一時停止を切替
    function toggleAudio() {
      if (isAudioPlaying) {
        bgm.pause();
        audioIcon.textContent = '🔇';
        audioText.textContent = 'BGM';
        isAudioPlaying = false;
      } else {
        bgm.play().then(() => {
          audioIcon.textContent = bgm.volume === 0 ? '🔇' : '🔊';
          audioText.textContent = 'BGM';
          isAudioPlaying = true;
        }).catch(err => console.log("Audio play error:", err));
      }
    }

    // 音量スライダーのイベント
    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      bgm.volume = val;
      
      if (isAudioPlaying) {
        audioIcon.textContent = val === 0 ? '🔇' : '🔊';
      }
    });

    // コントロールエリア内をクリックした時は流れ星を出さない
    audioContainer.addEventListener('click', (e) => {
      e.stopPropagation();
    });
    audioContainer.addEventListener('touchstart', (e) => {
      e.stopPropagation();
    });

    // BGMのON/OFFはボタンのみで切り替え
    audioBtn.addEventListener('click', () => {
      toggleAudio();
    });

    // 画面サイズ調整
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      rotationCenter = { x: width * 0.5, y: height * 0.01 };
      initStars();
    }

    window.addEventListener('resize', resize);

    // --- 星（背景）のクラス ---
    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        const maxRadius = Math.sqrt(Math.pow(width * 1.5, 2) + Math.pow(height * 1.5, 2));
        this.radius = Math.random() * maxRadius;
        this.angle = Math.random() * Math.PI * 2;

        this.size = Math.random() * 1.5 + 0.3;
        this.baseAlpha = Math.random() * 0.7 + 0.3;
        this.alpha = this.baseAlpha;
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinkleFactor = Math.random() * Math.PI * 2;
        
        const colorType = Math.random();
        if (colorType > 0.8) {
          this.color = '210, 230, 255';
        } else if (colorType > 0.6) {
          this.color = '255, 240, 210';
        } else {
          this.color = '255, 255, 255';
        }
      }

      update() {
        this.angle += rotationSpeed;
        this.twinkleFactor += this.twinkleSpeed;
        this.alpha = this.baseAlpha + Math.sin(this.twinkleFactor) * 0.3;
        if (this.alpha < 0) this.alpha = 0;
      }

      draw() {
        const x = rotationCenter.x + Math.cos(this.angle) * this.radius;
        const y = rotationCenter.y + Math.sin(this.angle) * this.radius;

        if (x < -20 || x > width + 20 || y < -20 || y > height + 20) return;

        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
        if (this.size > 1.2) {
          ctx.shadowBlur = 4;
          ctx.shadowColor = `rgba(${this.color}, 0.8)`;
        }
        ctx.fill();
        ctx.restore();
      }
    }

    // --- 流れ星のクラス ---
    class ShootingStar {
      constructor(targetX = null, targetY = null) {
        this.init(targetX, targetY);
      }

      init(targetX = null, targetY = null) {
        if (targetX !== null && targetY !== null) {
          const angle = Math.PI / 1.35 + (Math.random() - 0.5) * 0.2;
          const distance = Math.random() * 300 + 400;
          this.x = targetX - Math.cos(angle) * distance;
          this.y = targetY - Math.sin(angle) * distance;
          this.dx = Math.cos(angle);
          this.dy = Math.sin(angle);
        } else {
          this.x = Math.random() * width * 1.2 - width * 0.2;
          this.y = Math.random() * (height * 0.5);
          const angle = Math.PI / 1.35 + (Math.random() - 0.5) * 0.3;
          this.dx = Math.cos(angle);
          this.dy = Math.sin(angle);
        }

        this.speed = Math.random() * 8 + 12;
        this.length = Math.random() * 120 + 150;
        this.life = 0;
        this.maxLife = Math.random() * 40 + 50;
        this.size = Math.random() * 1 + 1.2;
        this.active = true;
      }

      update() {
        if (!this.active) return;

        this.x += this.dx * this.speed;
        this.y += this.dy * this.speed;
        this.life++;

        if (this.life >= this.maxLife || this.x > width + 300 || this.y > height + 300) {
          this.active = false;
        }
      }

      draw() {
        if (!this.active) return;

        const tailX = this.x - this.dx * this.length;
        const tailY = this.y - this.dy * this.length;

        const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        
        let headAlpha = 1;
        if (this.life < 10) {
          headAlpha = this.life / 10;
        } else if (this.life > this.maxLife - 15) {
          headAlpha = (this.maxLife - this.life) / 15;
        }

        gradient.addColorStop(0, `rgba(255, 255, 255, ${headAlpha})`);
        gradient.addColorStop(0.12, `rgba(180, 220, 255, ${headAlpha * 0.85})`);
        gradient.addColorStop(0.5, `rgba(120, 170, 255, ${headAlpha * 0.4})`);
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.save();
        
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = this.size;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${headAlpha})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(160, 200, 255, 0.9)';
        ctx.fill();
        
        ctx.restore();
      }
    }

    // 初期化
    function initStars() {
      stars = [];
      const starCount = Math.floor((width * height) / 400);
      for (let i = 0; i < starCount; i++) {
        stars.push(new Star());
      }
    }

    // ランダム生成
    function launchRandomShootingStar() {
      if (Math.random() < 0.015 && shootingStars.filter(s => s.active).length < 3) {
        shootingStars.push(new ShootingStar());
      }
      setTimeout(launchRandomShootingStar, 200);
    }

    // 画面クリック時は「流れ星」だけを発生させる
    window.addEventListener('click', (e) => {
      shootingStars.push(new ShootingStar(e.clientX, e.clientY));
    });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        shootingStars.push(new ShootingStar(e.touches[0].clientX, e.touches[0].clientY));
      }
    });

    // アニメーションループ
    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (const star of stars) {
        star.update();
        star.draw();
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const shootingStar = shootingStars[i];
        shootingStar.update();
        shootingStar.draw();

        if (!shootingStar.active) {
          shootingStars.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // 開始
    resize();
    animate();
    launchRandomShootingStar();
  </script>
</body>
</html>
